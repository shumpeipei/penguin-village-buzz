name: Update Community Invite Link

on:
  workflow_dispatch: # GitHub Actions の Web UI から手動実行可能
  # schedule:
  #   # 毎週月曜 午前 4:00 JST (日曜 19:00 UTC) に自動実行
  #   # GitHub Secrets に BUZZ_PRIVATE_KEY を登録した後にコメント解除してください
  #   - cron: '0 19 * * 0'

permissions:
  contents: write

jobs:
  update-invite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run invite update script
        env:
          BUZZ_PRIVATE_KEY: ${{ secrets.BUZZ_PRIVATE_KEY }}
          BUZZ_RELAY_URL: "https://png.communities.buzz.xyz"
        run: |
          python3 scripts/update-invite.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes in invite link"
          else
            git commit -m "chore: update buzz community invite link [skip ci]"
            git push
          fi
