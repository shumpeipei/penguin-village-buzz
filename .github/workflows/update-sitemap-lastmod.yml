name: Update Sitemap Lastmod

on:
  push:
    branches:
      - main
    paths:
      - index.html
  workflow_dispatch: # GitHub Actions の Web UI から手動実行可能

permissions:
  contents: write

concurrency:
  group: update-sitemap-lastmod
  cancel-in-progress: false

jobs:
  update-lastmod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update lastmod in sitemap.xml
        run: |
          # 日本時間の日付で上書きする（sitemap の lastmod は W3C 日付形式）
          lastmod="$(TZ=Asia/Tokyo date +%Y-%m-%d)"
          sed -i -E "s#<lastmod>[0-9]{4}-[0-9]{2}-[0-9]{2}</lastmod>#<lastmod>${lastmod}</lastmod>#" sitemap.xml

      - name: Commit and push changes
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "No changes in sitemap lastmod"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "chore: update sitemap lastmod [skip ci]"
          git push
